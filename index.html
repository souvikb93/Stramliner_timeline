<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
@font-face{font-family:'Uncut Sans';src:url(https://cdn.jsdelivr.net/gh/kaspernordkvist/uncut_sans@b3b42467781e3bd98c68f2d70eba325196e7d9c5/Webfonts/UncutSans-Variable.woff2) format('woff2');font-weight:300 700;font-style:normal;font-display:swap}
:root{--ink:#121212;--ink2:#454548;--ink3:#696970;--line:#E9E9EC;--line2:#D9D9DE;--brand:#0672CB;--deep:#06356E;--green:#1E8A4C;
--prep:#57575C;--disc:#0672CB;--syn:#7C3AED;--cc:#A15C00;--dd:#B02071;--vp:#0B6E4F}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;min-height:100%;overflow:hidden;background:transparent;font-family:'Uncut Sans',-apple-system,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased}
body{display:block!important}
.app{width:100vw;max-width:1200px;padding:2px;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:16px;padding:2px 2px 14px;border-bottom:1px solid var(--line)}
.tabs{position:relative;flex:none;display:flex;gap:3px;background:#fff;border:1px solid var(--line2);padding:4px;border-radius:999px;box-shadow:0 1px 2px rgba(18,18,18,.04)}
.tabs button{font:inherit;position:relative;z-index:1;display:flex;align-items:center;height:34px;padding:0 14px;border:0;background:transparent;border-radius:999px;color:var(--ink2);font-size:13px;font-weight:600;cursor:pointer;transition:color .25s}
.tabs button:hover{color:var(--ink)}
.tabs button.on{color:#fff}
.tabs button:focus-visible{outline:2px solid var(--brand);outline-offset:3px}
.tabs .pill{position:absolute;top:4px;left:4px;height:34px;border-radius:999px;background:var(--deep);z-index:0;transition:transform .42s cubic-bezier(.34,1.24,.5,1),width .42s cubic-bezier(.34,1.24,.5,1)}
.hint{font-size:11px;color:var(--ink3);white-space:nowrap}
.legend{display:flex;flex-wrap:wrap;gap:4px 13px;margin-left:auto}
.lg{display:flex;align-items:center;gap:6px;font-size:11px;font-weight:500;color:var(--ink2);white-space:nowrap}
.lg i{width:9px;height:9px;border-radius:3px;flex:none}
.canvas{margin-top:18px;background:#fff;border:1px solid var(--line);border-radius:22px;padding:24px;box-shadow:0 1px 2px rgba(18,18,18,.03)}
.grid{position:relative;display:grid;grid-template-columns:186px minmax(0,1fr);cursor:crosshair}
.spacer{grid-column:1;height:26px;border-bottom:1px solid var(--line)}
.axis{grid-column:2;position:relative;height:26px;border-bottom:1px solid var(--line)}
.mo{position:absolute;top:3px;font-size:10.5px;font-weight:600;color:var(--ink3);padding-left:6px;border-left:1px solid var(--line);height:20px}
.mo.q{border-left-color:var(--line2);color:var(--ink2)}
.mspacer{grid-column:1;height:22px}
.mrow{grid-column:2;position:relative;height:22px}
.ms{position:absolute;top:10px;width:10px;height:10px;transform:translate(-50%,-50%) rotate(45deg);background:#fff;border:1.7px solid var(--ink3);border-radius:2px;transition:background .3s,border-color .3s}
.ms.on{background:var(--green);border-color:var(--green)}
.msl{position:absolute;top:10px;transform:translateY(-50%);font-size:9.5px;font-weight:600;color:var(--ink2);white-space:nowrap;padding-left:10px}
.msl.end{transform:translate(-100%,-50%);padding:0 10px 0 0}
.ghead{grid-column:1/3;font-size:10px;font-weight:700;letter-spacing:.07em;color:var(--ink3);padding:10px 0 5px}
.rl{grid-column:1;display:flex;flex-direction:column;justify-content:center;height:36px;padding-right:14px}
.rl b{font-size:11.5px;font-weight:600;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rl span{font-size:9.5px;color:var(--ink3);line-height:1.2;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.track{grid-column:2;position:relative;height:36px;border-top:1px solid #F4F4F6}
.bar{position:absolute;height:20px;top:50%;transform:translateY(-50%);border-radius:5px;display:flex;align-items:center;justify-content:center;font-size:9.5px;font-weight:600;color:#fff;white-space:nowrap;overflow:hidden;opacity:.3;transition:opacity .3s,box-shadow .25s,filter .2s}
.bar.lo{height:10px;border-radius:3px;opacity:.24}
.bar.on{opacity:1;box-shadow:0 2px 6px rgba(18,18,18,.15)}
.bar.past{opacity:.55}
.bar.hov{filter:brightness(1.12);box-shadow:0 0 0 2px #fff,0 0 0 3.5px var(--ink2)}
.head{position:absolute;top:26px;bottom:0;width:2px;background:var(--brand);opacity:.55;pointer-events:none;z-index:3;transition:opacity .2s}
.head::before{content:"";position:absolute;top:-5px;left:-4px;width:10px;height:10px;border-radius:50%;background:var(--brand)}
.foot{display:flex;align-items:center;gap:12px;margin-top:24px;padding-top:24px;border-top:1px solid var(--line);min-height:42px}
.now{font-size:11px;font-weight:600;color:var(--ink3);flex:none;width:96px}
.act{font-size:12.5px;color:var(--ink2);line-height:1.35;min-height:17px}
.act b{font-weight:600;color:var(--ink)}
@media (min-width:900px){body{min-height:750px}}
@media (max-width:1040px){.legend{display:none}}
@media (max-width:760px){.top{flex-wrap:wrap}.canvas{overflow-x:auto;-webkit-overflow-scrolling:touch}.grid{min-width:880px}.foot{min-width:880px}}
@media (max-width:440px){.canvas{padding:16px}}
@media (prefers-reduced-motion:reduce){.bar,.ms,.tabs .pill,.head{transition:none}}
</style></head><body>
<div class="app">
 <div class="top">
  <div class="tabs" id="tabs" role="tablist" aria-label="View">
   <button data-v="play" class="on">Play</button>
   <button data-v="pause">Pause</button>
   <button data-v="all">Show all</button>
  </div>
  <span class="hint">Hover to scrub · scroll to step</span>
  <div class="legend" id="legend"></div>
 </div>
 <div class="canvas">
  <div class="grid" id="grid"></div>
  <div class="foot"><span class="now" id="now"></span><p class="act" id="act"></p></div>
 </div>
</div>
<script>
const PH={prep:['Preparation','#57575C'],disc:['Fieldwork','#0672CB'],syn:['Synthesise','#7C3AED'],cc:['Co-create','#A15C00'],dd:['Design & define','#B02071'],vp:['Validate & pilot','#0B6E4F']};
const W=52;
const MONTHS=['Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec','Jan','Feb'];
const GROUPS=[
 ['Setup and field research',[
  ['Project preparation','Protocol, recruitment, tools audit',[
    {ph:'prep',s:0,e:2,segs:[['Prep',0,2,'Discussion guide, recruitment and tool inventory',0]]}]],
  ['North America','USA, Canada · 12 interviews',[
    {ph:'disc',s:2,e:8,segs:[['USA',2,6.5,'United States',9],['CA',6.5,8,'Canada',3]]},
    {ph:'disc',s:8,e:11,thin:1,segs:[['',8,11,'Follow-up sessions and tool walkthroughs',0]]}]],
  ['Western Europe','FR, DE, ES, IT, NL · 16',[
    {ph:'disc',s:5,e:13,segs:[['FR',5,7,'France',4],['DE',7,9,'Germany',4],['ES',9,10.5,'Spain',3],['IT',10.5,12,'Italy',3],['NL',12,13,'Netherlands',2]]},
    {ph:'disc',s:13,e:16,thin:1,segs:[['',13,16,'Follow-ups across the five markets',0]]}]],
  ['UK & Ireland','UK, Ireland · 6 interviews',[
    {ph:'disc',s:6,e:11,segs:[['UK',6,9.5,'United Kingdom',4],['IE',9.5,11,'Ireland',2]]}]],
  ['Latin America','Brazil, Mexico · 8 interviews',[
    {ph:'disc',s:10,e:16,segs:[['BR',10,13.5,'Brazil',5],['MX',13.5,16,'Mexico',3]]},
    {ph:'disc',s:16,e:18,thin:1,segs:[['',16,18,'Carrier and logistics follow-ups',0]]}]],
  ['India','India · 6 interviews',[
    {ph:'disc',s:14,e:18,segs:[['IN',14,18,'India',6]]}]],
  ['Asia Pacific & Japan','Japan, China, Singapore · 9',[
    {ph:'disc',s:15,e:21,segs:[['JP',15,17.5,'Japan',4],['CN',17.5,19.5,'China',3],['SG',19.5,21,'Singapore',2]]},
    {ph:'disc',s:21,e:23,thin:1,segs:[['',21,23,'Translator-supported follow-ups',0]]}]],
  ['Australia & NZ','Australia, New Zealand · 5',[
    {ph:'disc',s:18,e:22,segs:[['AU',18,20.5,'Australia',3],['NZ',20.5,22,'New Zealand',2]]}]]]],
 ['Programme workstreams',[
  ['Synthesis','Rolling, per region',[
    {ph:'syn',s:8,e:25,segs:[['Per-region readouts',8,17,'Gaps and commonalities, region by region',0],['Cross-region',17,25,'Three insights, three opportunity areas',0]]}]],
  ['Co-creation','Architects, product, eng, sales',[
    {ph:'cc',s:20,e:29,segs:[['Vision',20,24,'Workshops on the shared vision',0],['Framework',24,29,'Module boundaries and ownership',0]]}]],
  ['Design & define','Modules, rule layer, blueprints',[
    {ph:'dd',s:26,e:45,segs:[['Five modules',26,34,'Create & Edit through Disposition & Recovery',0],['Rule layer',34,39,'Regional rules and the V&R engine',0],['Blueprints',39,45,'To-be service blueprints and UI',0]]}]],
  ['Validate & pilot','ANZ proof of concept',[
    {ph:'vp',s:42,e:52,segs:[['Prototype tests',42,46,'Sessions with care agents',0],['ANZ pilot',46,52,'Proof of concept, measured against baseline',0]]}]]]]
];
const MS=[[2,'Kick-off'],[13,'Interim findings'],[29,'Framework signed off'],[45,'Pilot go-live'],[51,'Impact readout']];
const $=i=>document.getElementById(i),pc=w=>w/W*100+'%';
const moOf=w=>MONTHS[Math.max(0,Math.min(11,Math.floor(w/W*12)))];

$('legend').innerHTML=Object.values(PH).map(p=>`<span class="lg"><i style="background:${p[1]}"></i>${p[0]}</span>`).join('');

let html='<div class="spacer"></div><div class="axis" id="axis">',BARS=[];
MONTHS.forEach((m,i)=>{html+=`<div class="mo${i%3?'':' q'}" style="left:${pc(i*W/12)};width:${100/12}%">${m}</div>`});
html+='</div><div class="mspacer"></div><div class="mrow">';
MS.forEach((m,i)=>{html+=`<div class="ms" id="m_${i}" style="left:${pc(m[0])}"></div><div class="msl${m[0]>W*.72?' end':''}" style="left:${pc(m[0])}">${m[1]}</div>`});
html+='</div>';
GROUPS.forEach(([gname,rows])=>{
 html+=`<div class="ghead">${gname}</div>`;
 rows.forEach((r,ri)=>{
  html+=`<div class="rl"><b>${r[0]}</b><span>${r[1]}</span></div><div class="track">`;
  r[2].forEach((b,bi)=>{
   b.segs.forEach((g,gi)=>{
    const id=`b${ri}_${bi}_${gi}`,code=g[0],s=g[1],e=g[2],full=g[3],iv=g[4];
    BARS.push({id,ph:b.ph,s,e,row:r[0],full,iv,thin:!!b.thin});
    const wp=(e-s)/W*100;
    html+=`<div class="bar${b.thin?' lo':''}" id="${id}" data-i="${BARS.length-1}" style="left:calc(${pc(s)} + ${gi?1:0}px);width:calc(${wp}% - ${gi?1:0}px);background:${PH[b.ph][1]}">${wp>2.6?code:''}</div>`})});
  html+='</div>'});
});
$('grid').innerHTML=html;
const headEl=document.createElement('div');headEl.className='head';headEl.id='head';$('grid').appendChild(headEl);

const _pill=document.createElement('span');_pill.className='pill';$('tabs').prepend(_pill);
function movePill(){const b=document.querySelector('#tabs button.on');if(!b)return;
 _pill.style.width=b.offsetWidth+'px';_pill.style.height=b.offsetHeight+'px';
 _pill.style.transform=`translateX(${b.offsetLeft-4}px) translateY(${b.offsetTop-4}px)`}
addEventListener('resize',movePill);movePill();
if(document.fonts)document.fonts.ready.then(movePill);
if(window.ResizeObserver)new ResizeObserver(movePill).observe($('tabs'));

const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
let wk=0,playing=true,timer=null,showAll=false,scrub=false,hov=-1;
function axisRect(){const a=$('axis').getBoundingClientRect(),g=$('grid').getBoundingClientRect();
 return {l:a.left-g.left,w:a.width,gl:a.left}}
function paint(){
 const a=axisRect();
 headEl.style.left=(a.l+a.w*wk/W)+'px';
 headEl.style.opacity=showAll?0:.55;
 const live=[];
 BARS.forEach(b=>{const el=$(b.id);
  const on=showAll||(wk>=b.s&&wk<b.e),past=!showAll&&wk>=b.e;
  el.classList.toggle('on',on);el.classList.toggle('past',past);
  if(on&&!showAll&&!b.thin)live.push(b)});
 MS.forEach((m,i)=>$('m_'+i).classList.toggle('on',showAll||wk>=m[0]));
 if(showAll){$('now').textContent='Full plan';
  $('act').innerHTML='<b>62 interviews across 17 countries in 7 regions</b>, then one framework designed, built and piloted in ANZ.';return}
 $('now').textContent=`${moOf(wk)} · wk ${Math.floor(wk)+1} of 52`;
 if(hov>=0){const b=BARS[hov];
  $('act').innerHTML=`<b>${b.row}</b> · ${b.full}${b.iv?` · ${b.iv} interviews`:''} · ${moOf(b.s)} to ${moOf(b.e-.01)}`;return}
 const hit=MS.find(m=>Math.abs(m[0]-wk)<.4);
 $('act').innerHTML=hit?`<b>Milestone —</b> ${hit[1]}`
  :live.length?live.map(b=>`<b>${b.row}</b> · ${b.full}`).join('&nbsp;&nbsp;·&nbsp;&nbsp;')
  :'Between phases';
}
function step(){wk+=.16;if(wk>W)wk=0;paint();timer=setTimeout(step,reduce?420:135)}
function play(){clearTimeout(timer);playing=true;showAll=false;scrub=false;mark('play');step()}
function pause(){clearTimeout(timer);playing=false;mark('pause');paint()}
function all(){clearTimeout(timer);playing=false;showAll=true;mark('all');paint()}
function mark(v){document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.v===v));movePill()}
$('tabs').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;({play:play,pause:pause,all:all})[b.dataset.v]()});

const grid=$('grid');
function weekAt(x){const a=axisRect();return Math.max(0,Math.min(W,(x-a.gl)/a.w*W))}
function clearHov(){BARS.forEach(b=>$(b.id).classList.remove('hov'))}
grid.addEventListener('mouseenter',()=>{if(showAll)return;scrub=true;clearTimeout(timer)});
grid.addEventListener('mousemove',e=>{if(showAll)return;
 scrub=true;clearTimeout(timer);wk=weekAt(e.clientX);
 const t=e.target.closest('.bar');const nh=t?+t.dataset.i:-1;
 if(nh!==hov){hov=nh;clearHov();if(hov>=0)$(BARS[hov].id).classList.add('hov')}
 paint()});
grid.addEventListener('mouseleave',()=>{scrub=false;hov=-1;clearHov();
 if(playing&&!showAll)step();else paint()});
grid.addEventListener('wheel',e=>{if(showAll)return;
 e.preventDefault();clearTimeout(timer);scrub=true;
 wk=Math.max(0,Math.min(W,wk+(e.deltaY+e.deltaX)*.012));paint()},{passive:false});
document.addEventListener('visibilitychange',()=>{if(document.hidden)clearTimeout(timer);else if(playing&&!scrub)step()});
paint();play();
</script></body></html>
